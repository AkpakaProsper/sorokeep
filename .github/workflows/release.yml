name: Release & Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      current: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for version change
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          TAG="v$CURRENT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping release"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist, creating release"
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.current }}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --latest

  test:
    needs: release
    if: needs.release.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vitest run

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # A job-level permissions block REPLACES the workflow-level one rather
      # than extending it, so `contents` has to be restated here. Without it
      # the SBOM upload gets "403 Resource not accessible by integration",
      # which is what stopped v1.1.0 from reaching npm.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      # Publish first. Attaching an SBOM to the release is useful but it is not
      # the release -- when the upload ran first, one 403 on a release asset
      # meant the package never reached npm at all while the tag and GitHub
      # release still existed, which is the worst of both outcomes.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file bom.json
      - name: Upload SBOM to Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release upload "$VERSION" bom.json --clobber

  publish-gpr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the owner scope
        id: scope
        # GitHub Packages requires the package scope to match the repository
        # owner. This was hardcoded to @abdulmalikalayande and broke when the
        # repo moved to the TegoLabs org -- "403 permission_denied: The
        # requested installation does not exist". Deriving it from the
        # repository means a future transfer cannot break it again.
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@${{ steps.scope.outputs.owner }}"
      - run: npm ci
      - run: npm run build
      - name: Rewrite package name for GitHub Packages
        env:
          OWNER: ${{ steps.scope.outputs.owner }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@' + process.env.OWNER + '/sorokeep';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2), 'utf8');
          "
      # The npm registry publish is the one that matters; a GitHub Packages
      # failure should not mark the whole release failed after npm succeeded.
      - run: npm publish
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
